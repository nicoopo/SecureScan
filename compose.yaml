services:

  # ── PHP-FPM / Symfony ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: securescan_app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changeme}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.0&charset=utf8mb4
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - cache_data:/var/www/html/var/cache
      - uploads_data:/var/www/html/var/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - securescan

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: securescan_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - securescan

  # ── Messenger worker (scans async) ───────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: securescan_worker
    restart: unless-stopped
    user: www-data
    command: php bin/console messenger:consume async --limit=50 --time-limit=3600 -vv
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changeme}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.0&charset=utf8mb4
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - uploads_data:/var/www/html/var/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - securescan

  # ── MySQL ─────────────────────────────────────────────────────────────────
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: securescan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-app}", "-p${MYSQL_PASSWORD:-!ChangeMe!}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
    networks:
      - securescan

volumes:
  vendor_data:
  uploads_data:
  cache_data:
  database_data:

networks:
  securescan:
    driver: bridge
