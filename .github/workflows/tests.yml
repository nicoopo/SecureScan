name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, intl, mbstring, xml, pdo, pdo_mysql, ctype, iconv
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        # --no-scripts : les auto-scripts Symfony (cache:clear, assets:install...)
        # tentent de se connecter à la base configurée dans .env, absente en CI.
        # Inutile ici : les tests sont des tests unitaires purs, sans kernel Symfony.
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Run PHPUnit
        run: vendor/bin/phpunit