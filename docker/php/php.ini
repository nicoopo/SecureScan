[PHP]
; Taille mémoire — les scans Semgrep peuvent être gourmands
memory_limit = 512M

; Upload ZIP jusqu'à 50 Mo
upload_max_filesize = 50M
post_max_size = 52M

; Timeout HTTP (les scans peuvent durer)
max_execution_time = 120

; Affichage erreurs (désactivé en prod via APP_ENV)
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = Europe/Paris
opcache.enable=0
opcache.enable_cli=0
